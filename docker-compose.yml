services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localhost:1234/v1}
      - LLM_API_KEY=${LLM_API_KEY:-lm-studio}
      - LLM_CHAT_MODEL=${LLM_CHAT_MODEL:-local-model}
      - LLM_EMBEDDING_MODEL=${LLM_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-768}
      - DB_PATH=/app/data/knowledge.db
    volumes:
      - ./data:/app/data

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "3456:80"
    depends_on:
      - server

